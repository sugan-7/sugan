spring:
  application:
    name: vertex-backend
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-stacktrace: never
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

vertex:
  api:
    version: v1
  security:
    jwt:
      secret: ${JWT_SECRET:super_secure_256_bit_vertex_jwt_secret_key_minimum_32_chars!}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
      refresh-secret: ${JWT_REFRESH_SECRET:super_secure_refresh_vertex_jwt_secret_key_minimum_32_chars!}
      refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  feature-flags:
    ai-coach: false
    adaptive-programming: false
    video-analysis: false
    coach-mode: false
    social: false
    wearables: false
    research-mode: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
